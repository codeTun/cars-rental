version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: cars-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cars-rental
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cars-rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cars-rental-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/cars-rental
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cars-rental-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cars-rental-frontend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/cars-rental?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - database
    networks:
      - cars-rental-network

networks:
  cars-rental-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local


